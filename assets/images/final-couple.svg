<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes giantHeartPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #ff8da3); }
        50% { transform: scale(1.18); filter: drop-shadow(0 0 10px #ff476f); }
      }
      @keyframes jumpLeft {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes jumpRight {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes confettiDrop {
        0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(140px) rotate(360deg); opacity: 0; }
      }
      @keyframes sparkleRotate {
        0%, 100% { transform: rotate(0deg) scale(0.7); opacity: 0.4; }
        50% { transform: rotate(45deg) scale(1.2); opacity: 1; }
      }

      .big-heart {
        transform-origin: 100px 48px;
        animation: giantHeartPulse 1.6s infinite ease-in-out;
      }
      .jump-bear-l {
        transform-origin: 65px 125px;
        animation: jumpLeft 1.2s infinite ease-in-out;
      }
      .jump-bear-r {
        transform-origin: 135px 125px;
        animation: jumpRight 1.2s infinite ease-in-out 0.2s;
      }
      .conf-1 { animation: confettiDrop 2.5s infinite linear; }
      .conf-2 { animation: confettiDrop 3.1s infinite linear 0.7s; }
      .conf-3 { animation: confettiDrop 2.8s infinite linear 1.4s; }
      .conf-4 { animation: confettiDrop 3.4s infinite linear 2.1s; }
      .sparkle-l {
        transform-origin: 40px 32px;
        animation: sparkleRotate 2.2s infinite ease-in-out;
      }
      .sparkle-r {
        transform-origin: 160px 32px;
        animation: sparkleRotate 2.2s infinite ease-in-out 1.1s;
      }
    </style>
  </defs>

  
  

  <!-- Falling Confetti -->
  <g class="conf-1">
    <rect x="25" y="0" width="4" height="4" fill="#ffe066"/>
    <rect x="85" y="-6" width="3" height="5" fill="#86efac"/>
    <rect x="145" y="-2" width="4" height="4" fill="#d8b4fe"/>
    <rect x="180" y="4" width="4" height="4" fill="#ff476f"/>
  </g>
  <g class="conf-2">
    <rect x="40" y="-8" width="5" height="3" fill="#ff9ebb"/>
    <rect x="110" y="-4" width="4" height="4" fill="#ffe066"/>
    <rect x="165" y="-10" width="3" height="4" fill="#86efac"/>
  </g>
  <g class="conf-3">
    <rect x="15" y="-2" width="4" height="4" fill="#93c5fd"/>
    <rect x="65" y="-12" width="4" height="4" fill="#ff476f"/>
    <rect x="130" y="-6" width="5" height="3" fill="#ffe066"/>
  </g>
  <g class="conf-4">
    <rect x="50" y="-6" width="4" height="4" fill="#d8b4fe"/>
    <rect x="95" y="-10" width="3" height="4" fill="#ff8da3"/>
    <rect x="175" y="-4" width="4" height="4" fill="#93c5fd"/>
  </g>

  <!-- Big Twinkling Stars -->
  <g class="sparkle-l" fill="#ffe066">
    <rect x="38" y="28" width="4" height="12"/>
    <rect x="34" y="32" width="12" height="4"/>
    <rect x="38" y="32" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="sparkle-r" fill="#ffe066">
    <rect x="158" y="28" width="4" height="12"/>
    <rect x="154" y="32" width="12" height="4"/>
    <rect x="158" y="32" width="4" height="4" fill="#ffffff"/>
  </g>

  <!-- ================= GIANT BEATING CELEBRATION HEART ================= -->
  <g class="big-heart">
    <!-- Heart Shadow -->
    <path fill="#ffd1de" d="M84 28 h32 v36 h-32z"/>
    <!-- Heart Outline -->
    <path fill="#381a2e" d="
      M84 22 h14 v6 h-14z
      M102 22 h14 v6 h-14z
      M78 28 h44 v8 h-44z
      M74 36 h52 v10 h-52z
      M78 46 h44 v8 h-44z
      M84 54 h32 v8 h-32z
      M90 62 h20 v6 h-20z
      M96 68 h8 v4 h-8z
    "/>
    <!-- Heart Fill -->
    <path fill="#ff476f" d="
      M86 24 h10 v6 h-10z
      M104 24 h10 v6 h-10z
      M80 30 h40 v8 h-40z
      M76 38 h48 v8 h-48z
      M80 46 h40 v8 h-40z
      M86 54 h28 v8 h-28z
      M92 62 h16 v6 h-16z
      M98 68 h4 v2 h-4z
    "/>
    <!-- Cute Highlight -->
    <rect x="84" y="30" width="6" height="6" fill="#ffffff"/>
    <rect x="82" y="36" width="6" height="8" fill="#ffffff"/>
  </g>

  <!-- Ground Shadows -->
  <rect x="42" y="126" width="46" height="6" fill="#ffd1de" rx="3"/>
  <rect x="112" y="126" width="46" height="6" fill="#ffd1de" rx="3"/>

  <!-- ================= LEFT JUMPING BEAR (WHITE) ================= -->
  <g class="jump-bear-l">
    <!-- Ears -->
    <rect x="48" y="62" width="12" height="12" fill="#381a2e"/>
    <rect x="52" y="66" width="6" height="6" fill="#ffb8c8"/>
    <rect x="74" y="62" width="12" height="12" fill="#381a2e"/>
    <rect x="76" y="66" width="6" height="6" fill="#ffb8c8"/>

    <!-- Head -->
    <rect x="44" y="70" width="46" height="38" fill="#381a2e"/>
    <rect x="48" y="74" width="38" height="30" fill="#ffffff"/>

    <!-- Cheeks -->
    <rect x="48" y="90" width="8" height="6" fill="#ff9ebb"/>
    <rect x="78" y="90" width="8" height="6" fill="#ff9ebb"/>

    <!-- Happy Eyes (^_^) -->
    <rect x="56" y="84" width="3" height="3" fill="#381a2e"/>
    <rect x="59" y="82" width="4" height="2" fill="#381a2e"/>
    <rect x="63" y="84" width="3" height="3" fill="#381a2e"/>

    <rect x="70" y="84" width="3" height="3" fill="#381a2e"/>
    <rect x="73" y="82" width="4" height="2" fill="#381a2e"/>
    <rect x="77" y="84" width="3" height="3" fill="#381a2e"/>

    <rect x="67" y="88" width="4" height="3" fill="#381a2e"/>

    <!-- Body -->
    <rect x="50" y="106" width="34" height="20" fill="#381a2e"/>
    <rect x="54" y="110" width="26" height="16" fill="#ffffff"/>

    <!-- Joyful Raised Paws -->
    <rect x="40" y="96" width="8" height="8" fill="#381a2e"/>
    <rect x="42" y="98" width="4" height="4" fill="#ffffff"/>
    <rect x="86" y="104" width="8" height="8" fill="#381a2e"/>
    <rect x="88" y="106" width="4" height="4" fill="#ffffff"/>
  </g>

  <!-- ================= RIGHT JUMPING BEAR (MOCHA) ================= -->
  <g class="jump-bear-r">
    <!-- Ears -->
    <rect x="114" y="62" width="12" height="12" fill="#381a2e"/>
    <rect x="116" y="66" width="6" height="6" fill="#d49b72"/>
    <rect x="140" y="62" width="12" height="12" fill="#381a2e"/>
    <rect x="142" y="66" width="6" height="6" fill="#d49b72"/>

    <!-- Head -->
    <rect x="110" y="70" width="46" height="38" fill="#381a2e"/>
    <rect x="114" y="74" width="38" height="30" fill="#e8be99"/>

    <!-- Cheeks -->
    <rect x="114" y="90" width="8" height="6" fill="#ff9ebb"/>
    <rect x="144" y="90" width="8" height="6" fill="#ff9ebb"/>

    <!-- Happy Eyes (^_^) -->
    <rect x="122" y="84" width="3" height="3" fill="#381a2e"/>
    <rect x="125" y="82" width="4" height="2" fill="#381a2e"/>
    <rect x="129" y="84" width="3" height="3" fill="#381a2e"/>

    <rect x="136" y="84" width="3" height="3" fill="#381a2e"/>
    <rect x="139" y="82" width="4" height="2" fill="#381a2e"/>
    <rect x="143" y="84" width="3" height="3" fill="#381a2e"/>

    <rect x="133" y="88" width="4" height="3" fill="#381a2e"/>

    <!-- Body -->
    <rect x="116" y="106" width="34" height="20" fill="#381a2e"/>
    <rect x="120" y="110" width="26" height="16" fill="#e8be99"/>

    <!-- Joyful Raised Paws -->
    <rect x="106" y="104" width="8" height="8" fill="#381a2e"/>
    <rect x="108" y="106" width="4" height="4" fill="#e8be99"/>
    <rect x="152" y="96" width="8" height="8" fill="#381a2e"/>
    <rect x="154" y="98" width="4" height="4" fill="#e8be99"/>
  </g>
</svg>
